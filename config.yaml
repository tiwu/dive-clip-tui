# Configuration for Dive Clip TUI

general:
  project_name: "Madagascar_Dives_2026"
  # Footage folder used when `dive-clip scan` is run without --input.
  # Keep input_dir and output_dir as separate folders that do not nest: ingest
  # walks the input tree recursively and would also pick up its own output.
  # input_dir: "/run/media/twuytens/SAMSUNG T9/dive-processing-test/in"
  input_dir: "/run/media/twuytens/SAMSUNG T9/dive-processing-test/x"  
  output_dir: "/run/media/twuytens/SAMSUNG T9/dive-processing-test/out"

ollama:
  # OLLAMA_HOST overrides this value when set (e.g. export OLLAMA_HOST=plotter.local:11434)
  host: "http://localhost:11434"
  model: "qwen2.5vl:3b"
  timeout_seconds: 120

scan_parameters:
  domain: "auto"                    # "auto" (Pass 0 classifies clip), "underwater", "motorcycle", or "generic"
  classify_clips: "auto"            # "auto" (run Pass 0 unless domain/tags set), "always", or "off"
  classify_frames_count: 3          # Number of sample frames per clip for Pass 0 domain classification
  coarse_fps: 0.25                   # 0.25 frames per second during coarse scan (1 frame every 4 seconds)
  coarse_scale: "426:-2"            # Downscale coarse frames for fast VLM screening
  fine_fps: 1.0                     # 1 frame per second during highlight windows
  fine_scale: "854:-2"             # Resolution for fine identification 
                                    #   (or "iw/2:-2" for half resolution or "null" for no scaling)
  coarse_confidence_threshold: 0.80 # Minimum confidence to trigger fine scan
  coarse_quality_threshold: 4       # Minimum score (1-10) to reject upside-down/dangling frames in coarse pass
  fine_padding_seconds: 2           # Extra context before/after detected action
  quality_threshold: 8              # Min. score (1-10) to include in EDL/Storyline
  checkpoint_interval_frames: 20    # Save intra-clip scan progress every N frames for fast resume
  # Temporary frame storage (RAM disk):
  # When true and /dev/shm is available (Linux), extracted frames are stored in shared
  # memory (/dev/shm) to maximize I/O throughput and eliminate SSD write wear during
  # video frame sampling. Set to false to force using standard disk temporary storage.
  # Automatically falls back to system temp on OSes without /dev/shm (e.g. macOS).
  use_ramdisk: true                 # Use /dev/shm on Linux for fast I/O

cloud_storyline:
  provider: "claude"                # "claude" or "gemini"
  model: "claude-3-5-sonnet-latest"
  target_edit_duration_minutes: 4

