# Configuration for Dive Clip TUI

general:
  project_name: "Madagascar_Dives_2026"
  # Path mapping: makes the script portable between macOS and Linux
  path_mapping:
    from_prefix: "/Volumes/SAMSUNG T9/dive-processing-test"
    to_prefix: "/Volumes/SAMSUNG T9/dive-processing-test"
  output_dir: "./outputs"

ollama:
  host: "http://localhost:11434"
  model: "qwen3-vl:4b"
  timeout_seconds: 90

scan_parameters:
  coarse_fps: 0.5                   # 1 frame per 2 seconds
  fine_fps: 2.0                     # 2 frames per second during highlight windows
  coarse_confidence_threshold: 0.65 # Minimum confidence to trigger fine scan
  fine_padding_seconds: 4           # Extra context before/after detected action
  quality_threshold: 7              # Min. score (1-10) to include in EDL/Storyline
  use_ramdisk: true                 # Use /dev/shm on Linux for fast I/O

cloud_storyline:
  provider: "claude"                # "claude" or "gemini"
  model: "claude-3-5-sonnet-latest"
  target_edit_duration_minutes: 4