# Configuration for Dive Clip TUI

general:
  project_name: "Madagascar_Dives_2026"
  # Footage folder used when `dive-clip scan` is run without --input.
  # Keep input_dir and output_dir as separate folders that do not nest: ingest
  # walks the input tree recursively and would also pick up its own output.
  # input_dir: "/run/media/twuytens/SAMSUNG T9/dive-processing-test/in"
  input_dir: "/run/media/twuytens/SAMSUNG T9/dive-processing-test/in"
  output_dir: "/run/media/twuytens/SAMSUNG T9/dive-processing-test/out"

ollama:
  # OLLAMA_HOST overrides this value when set (e.g. export OLLAMA_HOST=plotter.local:11434)
  host: "http://localhost:11434"
  model: "qwen2.5vl:3b"
  timeout_seconds: 120

# VLM backend for the scan pipeline (Pass 0, 1 and 2).
# "ollama" (default) uses the `ollama` section above. "openrouter" uploads sampled frames
# to OpenRouter's cloud API; set the OPENROUTER_API_KEY environment variable first.
vlm:
  provider: "ollama"                # "ollama" or "openrouter"
  openrouter:
    model: "nvidia/nemotron-3.5-super-vl:free"
    timeout_seconds: 120
    requests_per_minute: 20         # Client-side rate limit
    max_retries: 3                  # Retries on HTTP 429/5xx with exponential backoff

scan_parameters:
  domain: "auto"                    # "auto" (Pass 0 classifies clip), "underwater", "motorcycle", or "generic"
  classify_clips: "auto"            # "auto" (run Pass 0 unless domain/tags set), "always", or "off"
  classify_frames_count: 3          # Minimum number of sample frames per clip for Pass 0 domain classification
  classify_interval_seconds: 300    # Interval in seconds for dynamic Pass 0 sampling (1 frame per 5 min)
  classify_frames_max: 8            # Maximum number of sample frames for Pass 0 domain classification
  prefetch_coarse: true             # Prefetch Video N+1 coarse frames in /dev/shm during Video N inference
  video_encoder: "auto"             # Video encoder: "auto" (probes NVENC, falls back to libx264), "h264_nvenc", or "libx264"
  video_quality:                    # Constant-quality rate control shared by every encode (render, aftermovie)
    cq: 19                          # NVENC constant-quality level (lower = better quality, bigger files)
    crf: 19                         # libx264 CRF level (lower = better quality, bigger files)
  coarse_fps: 0.25                   # 0.25 frames per second during coarse scan (1 frame every 4 seconds)
  coarse_scale: "426:-2"            # Downscale coarse frames for fast VLM screening
  fine_fps: 1.0                     # 1 frame per second during highlight windows
  fine_scale: "1280:-2"             # Resolution for fine identification (720p; 854 gave the VLM too few pixels)
                                    #   (or "iw/2:-2" for half resolution or "null" for no scaling)
  coarse_confidence_threshold: 0.80 # Minimum confidence to trigger fine scan
  coarse_quality_threshold: 4       # Minimum score (1-10) to reject upside-down/dangling frames in coarse pass
  fine_padding_seconds: 2           # Extra context before/after detected action
  fine_pre_roll_seconds: 1.5        # Seconds to include before detected fine highlight
  fine_post_roll_seconds: 2.0       # Seconds to include after detected fine highlight
  merge_gap_seconds: 1.5            # Max gap between contiguous detections of same subject to merge
  max_clip_duration: 12.0           # Maximum duration (seconds) for a merged detection window
  quality_threshold: 8              # Min. score (1-10) to include in EDL/Storyline
  checkpoint_interval_frames: 20    # Save intra-clip scan progress every N frames for fast resume
  # Temporary frame storage (RAM disk):
  # When true and /dev/shm is available (Linux), extracted frames are stored in shared
  # memory (/dev/shm) to maximize I/O throughput and eliminate SSD write wear during
  # video frame sampling. Set to false to force using standard disk temporary storage.
  # Automatically falls back to system temp on OSes without /dev/shm (e.g. macOS).
  use_ramdisk: true                 # Use /dev/shm on Linux for fast I/O

cloud_storyline:
  provider: "claude"                # "claude" or "gemini"
  model: "claude-3-5-sonnet-latest"
  target_edit_duration_minutes: 4

selection:
  lambda_quality: 0.65              # MMR trade-off: 0.0 = pure diversity, 1.0 = pure quality
  per_clip_soft_limit: 1            # Soft quota per source clip before applying exponential penalty

# Pre-VLM screening funnel (Stage C/D). A cheap FFmpeg + telemetry pass runs before
# any VLM call and can reject or defer candidate windows so the model only sees
# footage worth describing. Disabled by default: nothing here runs until enabled.
prescreen:
  enabled: false                    # Turn the funnel on (FFmpeg sampling + telemetry)
  # "advisory" records gate failures but never drops a window. "enabled" rejects the
  # windows that fail a gate, which is the behaviour that actually saves VLM calls.
  gate_mode: "advisory"
  sample_fps: 0.5                   # Frames per second sampled for visual/HSV metrics
  sample_size: 64                   # Downscale samples to 64x64 for cheap luma/Laplacian math
  keyframes_only: true              # Prefer keyframes; falls back to a full seek pass if none
  audio_enabled: true               # Run the FFmpeg astats pass for peak levels
  audio_spike_db: 10.0              # dB above the rolling median that counts as a spike
  audio_spike_floor_db: -35.0       # Absolute floor so steady quiet audio never reads as a spike
  audio_window: 5                   # Rolling median window (in peak samples)
  blur_min: 12.0                    # Median Laplacian variance below this reads as soft/blurred
  contact_sheet: false              # Opt-in 2x2 contact sheets: up to 4x fewer VLM calls per clip
  # Telemetry score weights. Missing sensors are dropped and the rest renormalized.
  weights:
    lean_speed: 0.35                # Lean angle + speed magnitude
    gyro_stability: 0.25            # Inverse of gyro RMS (steadier footage scores higher)
    face: 0.20                      # Detected subject/face presence
    hue_change: 0.20                # Colour/hue churn across the window
  # Gate thresholds. Gate failures reject when gate_mode is "enabled".
  gate_thresholds:
    yavg_min: 15.0                  # Mean luma below this is too dark to be usable
    unif_max: 0.92                  # Luma uniformity above this is flat/fogged (featureless)
    gyro_max: 3.5                   # Gyro RMS above this is too shaky to use
  # Scene-domain prior resolution (Pass 0 classification confidence/coverage).
  domain_prior_thresholds:
    min_confidence: 0.80
    min_coverage: 0.80

