[project]
name = "underwater-resolve-ai"
version = "0.1.0"
description = "AI curation pipeline for underwater dive footage using DaVinci Resolve, Ollama Qwen2.5-VL, and CMX 3600 EDL markers"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "anthropic>=0.30.0",
    "google-generativeai>=0.8.0",
    "textual>=0.86.0",
]

[project.scripts]
scan-footage = "scripts.02_scan_footage:main"
generate-edl = "scripts.03_generate_edl:main"
plan-storyline = "scripts.04_plan_storyline:main"
ingest-media = "scripts.00_ingest_media:main"
dive-clip-tui = "tui.app:main"

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",    # Pyflakes errors
    "W",    # Pycodestyle warnings
    "F",    # Pyflakes
    "I",    # Isort import sorting
    "B",    # Flake8-bugbear
    "UP",   # Pyupgrade
    "C4",   # Flake8-comprehensions
    "RET",  # Flake8-return
    "SIM",  # Flake8-simplify
    "PERF", # Flake8-perf
    "RUF",  # Ruff-specific
    "DTZ",  # Flake8-datetimez
    "TID",  # Flake8-tidy-imports
]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Function calls in default arguments
    "RET504", # Unnecessary assignment before return
]
unfixable = [
    "F401",  # Imported but unused (can't auto-remove safely)
]
extend-select = [
    "I",  # Isort
]

[tool.ruff.format]
docstring-code-format = true
preview = true

[tool.ruff.isort]
known-first-party = ["scripts", "utils"]
known-third-party = ["pydantic", "yaml", "requests", "anthropic", "google.generativeai"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true