[project]
name = "dive-clip-tui"
version = "0.15.0"
description = "Local-first AI video curation with a terminal UI"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "anthropic>=0.30.0",
    "google-generativeai>=0.8.0",
    "textual>=0.86.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
scan-footage = "scripts.entrypoints:scan_footage"
generate-edl = "scripts.entrypoints:generate_edl"
plan-storyline = "scripts.entrypoints:plan_storyline"
ingest-media = "scripts.entrypoints:ingest_media"
render-clips = "scripts.entrypoints:render_clips"
assemble-clips = "scripts.entrypoints:assemble_clips"
create-aftermovie = "scripts.entrypoints:create_aftermovie"
dive-clip-tui = "tui.app:main"
dive-clip = "scripts.dive_clip:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["scripts*", "tui*", "utils*"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"
select = [
    "E",    # Pyflakes errors
    "W",    # Pycodestyle warnings
    "F",    # Pyflakes
    "I",    # Isort import sorting
    "B",    # Flake8-bugbear
    "UP",   # Pyupgrade
    "C4",   # Flake8-comprehensions
    "RET",  # Flake8-return
    "SIM",  # Flake8-simplify
    "PERF", # Flake8-perf
    "RUF",  # Ruff-specific
    "DTZ",  # Flake8-datetimez
    "TID",  # Flake8-tidy-imports
]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Function calls in default arguments
    "RET504", # Unnecessary assignment before return
]
unfixable = [
    "F401",  # Imported but unused (can't auto-remove safely)
]
extend-select = [
    "I",  # Isort
]

[tool.ruff.format]
docstring-code-format = true
preview = true

[tool.ruff.isort]
known-first-party = ["scripts", "utils"]
known-third-party = ["pydantic", "yaml", "requests", "anthropic", "google.generativeai"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true