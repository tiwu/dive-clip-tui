# Configuration preset: Aftermovie
# Optimized for creating a 3-5 minute highlight video from dive footage.
# Base config: config.yaml

general:
  project_name: "Madagascar_Dives_2026"
  output_dir: "./outputs"

ollama:
  host: "http://localhost:11434"
  model: "qwen2.5-vl:7b"
  timeout_seconds: 90

scan_parameters:
  coarse_fps: 0.5
  fine_fps: 2.0
  coarse_confidence_threshold: 0.6
  fine_padding_seconds: 5
  quality_threshold: 6          # Lower threshold to include more clips for aftermovie
  use_ramdisk: true

cloud_storyline:
  provider: "claude"
  model: "claude-3-5-sonnet-latest"
  target_edit_duration_minutes: 4

aftermovie:
  top_n_clips: 15               # Number of top clips to include
  music_volume: 0.15            # Background music volume relative to video
  fade_duration: 1.0            # Cross-dissolve fade duration (seconds)
  target_duration_minutes: 4    # Target aftermovie length
