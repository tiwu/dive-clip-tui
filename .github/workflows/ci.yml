name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run tests with coverage
        run: |
          uv run python -m pytest --cov --cov-report=term --cov-report=json:coverage.json
          uv run python scripts/ci_summary.py test-coverage --coverage-json coverage.json

      - name: Check lint and formatting for changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -d '' PY_FILES < <(
            git diff --name-only -z --diff-filter=ACMR "${BASE_SHA}...HEAD" -- '*.py'
          )
          if ((${#PY_FILES[@]})); then
            uv run ruff check "${PY_FILES[@]}"
            uv run ruff format --check "${PY_FILES[@]}"
          else
            echo "No changed Python files to check."
          fi
          uv run python scripts/ci_summary.py lint-format --file-count "${#PY_FILES[@]}"

      - name: Validate changelog entry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          uv run python scripts/release.py validate-pr \
            --base "$BASE_SHA" \
            --labels-json "$PR_LABELS"
          uv run python scripts/ci_summary.py release-pr --labels-json "$PR_LABELS"
