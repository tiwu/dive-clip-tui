name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run tests
        run: uv run python -m pytest

      - name: Check lint and formatting for changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -d '' PY_FILES < <(
            git diff --name-only -z --diff-filter=ACMR "${BASE_SHA}...HEAD" -- '*.py'
          )
          if ((${#PY_FILES[@]})); then
            uv run ruff check "${PY_FILES[@]}"
            uv run ruff format --check "${PY_FILES[@]}"
          else
            echo "No changed Python files to check."
          fi

      - name: Validate changelog entry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: >-
          uv run python scripts/release.py validate-pr
          --base "$BASE_SHA"
          --labels-json "$PR_LABELS"
