name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Fetch merged pull request metadata
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: >-
          gh pr list
          --repo "$GITHUB_REPOSITORY"
          --state merged
          --base main
          --limit 1000
          --json mergeCommit,labels
          > "$RUNNER_TEMP/merged-pull-requests.json"

      - name: Prepare release
        id: prepare
        run: >-
          python scripts/release.py prepare
          --pull-requests-json "$RUNNER_TEMP/merged-pull-requests.json"
          --date "$(date -u +%F)"
          --github-output "$GITHUB_OUTPUT"
          --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Update lockfile
        if: steps.prepare.outputs.release == 'true'
        run: uv lock --no-upgrade

      - name: Commit and tag release
        if: steps.prepare.outputs.release == 'true'
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md pyproject.toml uv.lock
          git commit -m "chore(release): v${VERSION}"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin HEAD:main "refs/tags/v${VERSION}"

      - name: Publish GitHub Release
        if: steps.prepare.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: >-
          gh release create "v${VERSION}"
          --title "v${VERSION}"
          --notes-file "$RUNNER_TEMP/release-notes.md"
